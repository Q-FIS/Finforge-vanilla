[project]
name = "rag"
version = "0.1.0"
description = "Vanilla RAG over annual reports, built from scratch"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf",
    "numpy",
    "sentence-transformers",
    "torch",
    "faiss-cpu",
    "scikit-learn",
    "ranx",
    "pyyaml",
    "dacite",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

# CPU-only PyTorch: the default Linux wheel ships CUDA (~2 GB) that nobody here needs.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Same-named test files in different team folders (tests/rep/test_x.py and
# tests/gen/test_x.py) would clash under the default import mode.
addopts = "--import-mode=importlib"
